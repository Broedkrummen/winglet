name: winglet
label: Winglet
kind: platform
version: 0.6.0
description: >
  Winglet: your Hermes agents on your phone. Adds the Winglet mobile app as a
  messaging platform, with QR pairing, push notifications, and one-tap
  approvals. Serves the installable web app for iPhone and desktop.
author: VIKASRP24
python_dependencies:
  # Hermes pins exact versions in its shared environment and disables any plugin whose ranges
  # conflict on update, so only cap majors with known breaking APIs.
  - "aiohttp>=3.9,<4"
  - "cryptography>=41"
  - "httpx>=0.27,<1"
  - "qrcode>=7.4.2"
requires_env: []
optional_env:
  - name: WINGLET_ENABLED
    description: "Start Winglet with the gateway (true/false). `hermes winglet setup` sets this."
    prompt: "Enable Winglet? (true/false)"
    password: false
  - name: WINGLET_PORT
    description: "Port the app connects to (default 8787)"
    prompt: "Winglet port"
    password: false
  - name: WINGLET_HOST
    description: "Bind address (default 127.0.0.1 with automatic HTTPS; 0.0.0.0 for direct access)"
    prompt: "Winglet bind address"
    password: false
  - name: WINGLET_PUBLIC_URL
    description: "URL your phone uses to reach this machine, e.g. https://box.tailnet.ts.net (used in pairing QR codes)"
    prompt: "Winglet public URL (or empty)"
    password: false
  - name: WINGLET_CONNECTION
    description: "quick: account-free automatic Cloudflare HTTPS; direct: use your own address. Setup defaults to quick."
    prompt: "Winglet connection (quick/direct)"
    password: false
  - name: WINGLET_NTFY_SERVER
    description: "ntfy server for Android notifications (default https://ntfy.sh)"
    prompt: "ntfy server URL (or empty)"
    password: false
  - name: WINGLET_HOME_CHANNEL
    description: "Chat that receives routine / cron results (default: home)"
    prompt: "Home chat id (or empty)"
    password: false
  - name: WINGLET_ALLOW_WEB_SECRETS
    description: "Allow entering API keys from the web app over the automatic HTTPS tunnel (default: off; the Android app and direct connections are always allowed)"
    prompt: "Allow API keys from the web app over the tunnel? (true/false)"
    password: false

provides_tools:
  - phone_status
  - phone_shared_note
  - phone_location
  - phone_contacts
  - phone_calendar
