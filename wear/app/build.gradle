plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
def dev = providers.gradleProperty('wingletDev').orNull == 'true'
android {
    namespace 'dev.winglet.watch'
    compileSdk 36
    defaultConfig {
        applicationId 'io.github.broedkrummen.winglet' + (dev ? '.dev' : '')
        minSdk 30
        targetSdk 36
        versionCode 600
        versionName '0.6.0-wear-preview'
    }
    // Data Layer requires the phone and watch to share package AND signing certificate.
    // A local QA key may be supplied explicitly; never include release credentials here.
    if (providers.gradleProperty('wingletQaKeystore').isPresent()) {
        if (!dev) throw new GradleException('QA signing is only available with -PwingletDev=true')
        signingConfigs { qa {
            storeFile file(providers.gradleProperty('wingletQaKeystore').get())
            storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android'
        } }
        buildTypes { debug { signingConfig signingConfigs.qa } }
    }
    buildTypes { release { minifyEnabled false } }
    sourceSets.main.java.srcDirs += ['../shared/src/main/kotlin', '../shared-android/src/main/kotlin']
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    // Resolve the KMP annotation module and its JVM variant together.
    implementation 'androidx.annotation:annotation:1.8.2'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation 'com.google.crypto.tink:tink-android:1.23.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}
