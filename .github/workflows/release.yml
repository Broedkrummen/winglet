name: Release

# Push a tag like v0.1.0 to build the Android APK and the plugin bundle and attach them to a
# GitHub Release. Can also be run by hand from the Actions tab (artifacts only, no release).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    name: Tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-aiohttp http_ece pyyaml packaging
      - name: Install the plugin's declared dependencies
        run: |
          python - <<'PY'
          import pathlib, subprocess, sys, yaml
          manifest = yaml.safe_load(pathlib.Path('plugin/plugin.yaml').read_text())
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', *manifest['python_dependencies']])
          PY
      - run: pytest -q
      - run: python scripts/check_web_bundle.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci && npx tsc --noEmit && npm test
        working-directory: app

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc)\.[0-9]+)?$ ]] || { echo "::error::Tags must look like v1.2.3 or v1.2.3-beta.1"; exit 1; }
            [ "$HAS_SIGNING_KEY" = "true" ] || { echo "::error::Releases need the signing key secrets (see docs/RELEASING.md)"; exit 1; }
            LABEL="$VERSION"
          else
            VERSION="$(node -p "require('./app/app.json').expo.version")"
            LABEL="dev-${GITHUB_SHA::7}"
            [ "$HAS_SIGNING_KEY" = "true" ] || LABEL="${LABEL}-debugkey"
          fi
          echo "WINGLET_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APK_LABEL=$LABEL" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: Generate native Android project
        working-directory: app
        run: npx expo prebuild --platform android --no-install
      - name: Load signing key
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "WINGLET_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
      - name: Build release APKs
        working-directory: app/android
        env:
          WINGLET_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WINGLET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WINGLET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          # One APK per CPU instead of a universal one (app/plugins/withApkSplits.js).
          WINGLET_SPLIT_APKS: "1"
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Check the signatures
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          for ABI in arm64-v8a armeabi-v7a; do
            APK="app/android/app/build/outputs/apk/release/app-${ABI}-release.apk"
            [ -f "$APK" ] || { echo "::error::Missing $APK"; ls app/android/app/build/outputs/apk/release; exit 1; }
            "$APKSIGNER" verify --print-certs "$APK" | tee certs.txt
            if [ "$HAS_SIGNING_KEY" = "true" ] && grep -q "CN=Android Debug" certs.txt; then
              echo "::error::Release APK is signed with the debug key"; exit 1
            fi
          done
      - name: Rename APKs
        run: |
          mkdir -p out
          for ABI in arm64-v8a armeabi-v7a; do
            cp "app/android/app/build/outputs/apk/release/app-${ABI}-release.apk" "out/winglet-${APK_LABEL}-${ABI}.apk"
          done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: winglet-apk
          path: out/*.apk

  plugin:
    name: Plugin bundle (with web app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build web app into plugin/web
        run: ./scripts/build-web.sh
      - name: Zip plugin
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="dev-${GITHUB_SHA::7}"
          mkdir -p out
          cp -r plugin winglet
          zip -qr "out/winglet-plugin-${VERSION}.zip" winglet -x 'winglet/__pycache__/*'
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: winglet-plugin
          path: out/*.zip

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [checks, android, plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs/releases
      - name: Release notes
        run: |
          # docs/releases/<tag>.md, when there is one, goes above GitHub's list of merged PRs.
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          [ -f "$NOTES" ] || { NOTES="$RUNNER_TEMP/notes.md"; : > "$NOTES"; }
          echo "NOTES=$NOTES" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Winglet ${{ github.ref_name }}
          files: out/*
          body_path: ${{ env.NOTES }}
          generate_release_notes: true
          # v1.2.3-beta.1 and v1.2.3-rc.1 are pre-releases; "latest" stays on the last full release.
          prerelease: ${{ contains(github.ref_name, '-') }}
